# Retrolities - build environment (Open Watcom v2)
#
#   docker compose run --rm build              # build everything into ./build
#   docker compose run --rm build make dos     # one platform (dos | win16 | win9x | winnt)
#   docker compose run --rm build make help    # all make targets
#   docker compose run --rm build bash         # interactive Open Watcom shell
#   docker compose run --rm test               # smoke tests (DOSBox-X + Wine)
#
# Export UID/GID (e.g. `export UID GID=$(id -g)`) if your user is not 1000:1000.
services:
  build:
    build:
      context: ./docker/build
    image: retrolities-openwatcom:latest
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/src
    working_dir: /src
    command: make

  test:
    profiles: ["test"]
    build:
      context: ./docker/test
    image: retrolities-test:latest
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/src
    working_dir: /src
    command: tests/run.sh
